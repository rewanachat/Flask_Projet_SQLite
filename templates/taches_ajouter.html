<!doctype html>
<html>
<head><meta charset="utf-8"><title>Ajouter tâche</title></head>
<body>
  <h1>Ajouter une tâche</h1>
  <form method="post">
    <label>Titre <input name="title" required></label><br>

  <a href="{{ url_for('lister_taches') }}">Retour</a>
</body>
</html>
